EncoderPreview.Tooltip.Compare="Shows the raw program output next to the actual encoded result, so you can see what your encoder settings and ROI regions do to quality."
EncoderPreview.Tooltip.CompareVertical="Puts the source on top and the encoded output below instead of side by side, useful on vertical monitors."
EncoderPreview.Tooltip.Encoder="Pick the encoder to monitor. Encoders only exist while they are in use (streaming, recording or replay buffer active), or after they have been used once. Use Refresh after starting an output."
EncoderPreview.Tooltip.RunInBackground="Keeps decoding the encoder output after closing this dialog, e.g. when the preview source is added to a scene."
EncoderPreview.Tooltip.AddToScene="Adds the decoded encoder output as a source to your current scene, so you can monitor it like any other source."
