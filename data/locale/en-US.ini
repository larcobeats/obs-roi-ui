ROI.HelpText="The region of interest determines which areas an encoder should (de-)prioritize.<br>Note that not all encoders support this feature an some may overshoot the target bitrate when using ROI."
ROI.Usage="Regions currently in use:"
ROI.Usage.Warning="Some encoders such as QSV do not support more than 256 regions, please keep it reasonable!"
ROI.Usage.Error="Using the ROI plugin output scaling (Settings -> Video) is not currently supported! Use the rescaling options in the advanced output options (Settings -> Output) instead."

# Tooltips
ROI.Tooltip.Scene="Regions are saved per scene. The plugin automatically re-applies the active scene's regions when you switch scenes."
ROI.Tooltip.RegionList="Regions in this list are applied to the encoder. When regions overlap, the one higher in the list wins. Use the arrow buttons to reorder."
ROI.Tooltip.BlockSize="Only affects this preview's grid visualization, not the encoder itself. Pick the size matching your codec so the preview is accurate: 16x16 for H.264, 32x32 for NVENC/QSV HEVC, 64x64 for AV1."
ROI.Tooltip.Priority="How strongly the encoder should favor this area. Positive values spend more bitrate here (sharper), negative values let it degrade to free up bits for the rest. It is a trade-off at fixed bitrate: 20-35% is a good range for facecams."
ROI.Tooltip.RegionEnabled="Toggle this region on or off without deleting it."
ROI.Tooltip.PriorityHint="What this priority actually does inside the encoder. OBS converts the percentage to a quantizer (QP) offset on the region's blocks — lower QP means more bits and sharper image, and every 6 QP roughly doubles the bits. Because the offset cannot push QP past its floor, values beyond about 40% usually behave the same as 100%."
ROI.Tooltip.SceneItem="The source this region follows. Moving, resizing, hiding or showing the source automatically updates the region. Items inside groups are listed as 'Group → Source'."
ROI.Tooltip.Smoothing="Adds stepped transition zones so there is no hard quality edge at the region border. Inside fades within the region, Outside fades beyond it, Edge does both."
ROI.Tooltip.SmoothingSteps="Number of gradient steps used for the transition."
ROI.Tooltip.SmoothingPriority="The priority value the smoothing fades to at its outermost step (0% = neutral)."
ROI.Tooltip.OuterPriority="Priority applied to the area outside the outer radius. Use a negative value to free up bits from the frame edges."
ROI.Tooltip.RadiusInner="Radius of the boosted center area, in pixels."
ROI.Tooltip.RadiusOuter="Distance from the frame edges over which quality fades towards the outer priority."
ROI.Tooltip.Padding="Grows (positive) or shrinks (negative) the region by this many pixels on every side. Positive covers borders/shadows around a source; negative keeps the region inside the source so the encoder's block rounding cannot spill past its edges (use the block size of your codec, e.g. -32 for NVENC HEVC)."
ROI.Tooltip.Opacity="Transparency of the colored overlay in this preview only. Green = boosted, red = deprioritized."
ROI.Tooltip.Enable="Master switch. No regions are applied to any encoder unless this is checked. Can also be bound to a hotkey in OBS Settings → Hotkeys (\"Toggle Region of Interest\")."
ROI.Tooltip.ExcludeRecording="When checked, regions only apply to streaming encoders. Local recordings and the replay buffer stay untouched (recommended)."
ROI.Tooltip.Preview="Shows how regions map onto encoder blocks. The white outline is the exact region; the colored blocks around it show the encoder's block-granularity coverage (set the block size above to match your codec). Tip: click and drag here to draw a new manual region."
ROI.Tooltip.Status="Shows which encoders currently have regions applied. Encoders only exist while streaming, recording, or running the encoder preview."
ROI.Tooltip.Copy="Copy this scene's regions to another scene (or all scenes)."
ROI.Tooltip.Import="Load regions for this scene from a JSON file."
ROI.Tooltip.Export="Save this scene's regions to a JSON file."

